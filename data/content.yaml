          - <strong>문제:</strong> TTL 기반 캐시의 Cache Miss 발생 시 DB로 조회가 집중되는 병목 현상으로 응답 지연 발생
          - <strong>해결:</strong> 개별 갱신 방식에서 Batch 기반 100% Full Cache 구조로 전환하여 모든 조회 요청을 Redis에서 즉시 응답(100% Hit)하도록 개선
          - <strong>결과:</strong> DB I/O 부하를 획기적으로 낮추고 서비스 조회 성능 최적화
